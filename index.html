<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Cube600</title><script src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'></script><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#07080c;color:#fff;font-family:system-ui;overflow:hidden;height:100vh}#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:12px;z-index:10}.pill{background:#15151a;border:1px solid #333;padding:6px 12px;border-radius:999px;font-size:13px}#controls{position:fixed;bottom:60px;left:0;right:0;padding:10px;z-index:10;background:linear-gradient(0deg,#000,transparent)}.btn{height:46px;border-radius:12px;border:1px solid #333;background:#121218;color:#fff;font-weight:900;margin:3px;width:15%}.scr{background:#ff1744;width:22%}.sol{background:#00e5ff;color:#000;width:22%}#ad-banner{position:fixed;bottom:0;left:0;right:0;height:60px;background:#101018;border-top:1px solid #2a2a35;z-index:9999;display:flex;align-items:center;justify-content:center;text-align:center}</style></head><body><div id='hud'><div style='font-weight:900'>CUBE600</div><div class='pill'>MOVES <b id='mv'>0</b> TIME <b id='tm'>00:00</b></div></div><div id='controls'><button class='btn scr' onclick='app.scramble()'>SCRAMBLE</button><button class='btn sol' onclick='app.checkSolved(true)'>CHECK</button><button class='btn' onclick='app.reset()'>RESET</button><button class='btn' onclick='app.undo()'>UNDO</button><br><button class='btn' onclick='app.queueMove("U")'>U</button><button class='btn' onclick='app.queueMove("U&apos;")'>U'</button><button class='btn' onclick='app.queueMove("D")'>D</button><button class='btn' onclick='app.queueMove("D&apos;")'>D'</button><button class='btn' onclick='app.queueMove("F")'>F</button><button class='btn' onclick='app.queueMove("F&apos;")'>F'</button><br><button class='btn' onclick='app.queueMove("B")'>B</button><button class='btn' onclick='app.queueMove("B&apos;")'>B'</button><button class='btn' onclick='app.queueMove("L")'>L</button><button class='btn' onclick='app.queueMove("L&apos;")'>L'</button><button class='btn' onclick='app.queueMove("R")'>R</button><button class='btn' onclick='app.queueMove("R&apos;")'>R'</button></div><div id='ad-banner'><div><div style='font-size:9px;letter-spacing:2px;color:#555'>AD - YOUR EARNINGS READY</div><div style='font-size:12px'>Earn KES 80 per 1000 views - AdMob Ready</div></div></div><script>
function createSticker(hex){var c=document.createElement('canvas');c.width=256;c.height=256;var ctx=c.getContext('2d');ctx.fillStyle='#000';ctx.fillRect(0,0,256,256);var r=40;ctx.fillStyle=hex;ctx.beginPath();ctx.moveTo(r,0);ctx.lineTo(256-r,0);ctx.quadraticCurveTo(256,0,256,r);ctx.lineTo(256,256-r);ctx.quadraticCurveTo(256,256,256-r,256);ctx.lineTo(r,256);ctx.quadraticCurveTo(0,256,0,256-r);ctx.lineTo(0,r);ctx.quadraticCurveTo(0,0,r,0);ctx.closePath();ctx.fill();var g=ctx.createLinearGradient(0,0,0,120);g.addColorStop(0,'rgba(255,255,255,0.6)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g;ctx.fill();return new THREE.CanvasTexture(c);}var FACE_COLORS={U:'#ffffff',D:'#ffeb3b',F:'#4caf50',B:'#2196f3',L:'#ff9800',R:'#f44336'};var TEX={};Object.keys(FACE_COLORS).forEach(function(k){TEX[k]=createSticker(FACE_COLORS[k]);});var AXIS_MAP={U:{axis:'y',val:1},D:{axis:'y',val:-1},F:{axis:'z',val:1},B:{axis:'z',val:-1},L:{axis:'x',val:-1},R:{axis:'x',val:1}};function fmtTime(s){var m=Math.floor(s/60);var sec=s%60;return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');}class Renderer{constructor(){this.scene=new THREE.Scene();this.scene.background=new THREE.Color(0x07080c);this.camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,100);this.camera.position.set(6.5,7.5,8.5);this.renderer=new THREE.WebGLRenderer({antialias:true});this.renderer.setSize(innerWidth,innerHeight);document.body.appendChild(this.renderer.domElement);this.scene.add(new THREE.AmbientLight(0xffffff,0.85));var d1=new THREE.DirectionalLight(0xffffff,0.6);d1.position.set(5,10,7);this.scene.add(d1);this.group=new THREE.Group();this.scene.add(this.group);this.bindEvents();this.animate();}bindEvents(){var drag=false,last={x:0,y:0};var el=this.renderer.domElement;var self=this;el.addEventListener('pointerdown',function(e){drag=true;last.x=e.clientX;last.y=e.clientY;});window.addEventListener('pointerup',function(){drag=false;});window.addEventListener('pointermove',function(e){if(!drag||window.app&&app.isAnimating)return;self.group.rotation.y+=(e.clientX-last.x)*0.008;self.group.rotation.x+=(e.clientY-last.y)*0.008;last.x=e.clientX;last.y=e.clientY;});}animate(){var self=this;requestAnimationFrame(function(){self.animate();});this.renderer.render(this.scene,this.camera);}clearGroup(){while(this.group.children.length){this.group.remove(this.group.children[0]);}}createPiece(x,y,z){var geo=new THREE.BoxGeometry(0.96,0.96,0.96);var mats=[];var faceDef=[{axis:'x',val:1,key:'R'},{axis:'x',val:-1,key:'L'},{axis:'y',val:1,key:'U'},{axis:'y',val:-1,key:'D'},{axis:'z',val:1,key:'F'},{axis:'z',val:-1,key:'B'}];faceDef.forEach(function(fd){var mat;if((fd.axis=='x'&&x==fd.val)||(fd.axis=='y'&&y==fd.val)||(fd.axis=='z'&&z==fd.val)){mat=new THREE.MeshLambertMaterial({map:TEX[fd.key]});}else{mat=new THREE.MeshLambertMaterial({color:0x111111});}mats.push(mat);});var mesh=new THREE.Mesh(geo,mats);mesh.position.set(x,y,z);mesh.userData={origin:{x:x,y:y,z:z},pos:{x:x,y:y,z:z}};this.group.add(mesh);return mesh;}}class CubeApp{constructor(r){this.r=r;this.isAnimating=false;this.queue=[];this.history=[];this.moveCount=0;this.seconds=0;this.timer=null;this.reset();}reset(){this.r.clearGroup();this.pieces=[];for(var x=-1;x<=1;x++)for(var y=-1;y<=1;y++)for(var z=-1;z<=1;z++){if(x==0&&y==0&&z==0)continue;var p=this.r.createPiece(x,y,z);this.pieces.push(p);}this.moveCount=0;this.seconds=0;this.history=[];this.queue=[];document.getElementById('mv').innerText=0;document.getElementById('tm').innerText='00:00';this.stopTimer();this.r.group.rotation.set(0.35,0.7,0);}startTimer(){if(this.timer)return;var self=this;this.timer=setInterval(function(){self.seconds++;document.getElementById('tm').innerText=fmtTime(self.seconds);},1000);}stopTimer(){clearInterval(this.timer);this.timer=null;}queueMove(n){this.queue.push(n);this.processQueue();}processQueue(){if(this.isAnimating||this.queue.length==0)return;var nn=this.queue.shift();this.execute(nn);}execute(notation){if(this.isAnimating)return;this.startTimer();var face=notation[0];var prime=notation.indexOf("'")>-1;var axisInfo=AXIS_MAP[face];var axis=axisInfo.axis;var layerVal=axisInfo.val;var toMove=this.pieces.filter(function(p){return Math.round(p.userData.pos[axis])==layerVal;});this.isAnimating=true;var pivot=new THREE.Group();this.r.group.add(pivot);var self=this;toMove.forEach(function(c){self.r.group.remove(c);pivot.add(c);});var dir=1;if(face=='U'||face=='F'||face=='R'||face=='B')dir=prime?-1:1;else dir=prime?1:-1;if(face=='D'||face=='L')dir*=-1;if(face=='B')dir*=-1;var target=Math.PI/2*dir;var cur=0;var step=target/12;var iv=setInterval(function(){pivot.rotation[axis]+=step;cur+=step;if(Math.abs(cur)>=Math.abs(target)-0.0001){clearInterval(iv);toMove.forEach(function(c){var wp=new THREE.Vector3();c.getWorldPosition(wp);var wq=new THREE.Quaternion();c.getWorldQuaternion(wq);pivot.remove(c);c.userData.pos.x=Math.round(wp.x);c.userData.pos.y=Math.round(wp.y);c.userData.pos.z=Math.round(wp.z);c.position.set(c.userData.pos.x,c.userData.pos.y,c.userData.pos.z);c.quaternion.copy(wq);self.r.group.add(c);});self.r.group.remove(pivot);self.isAnimating=false;if(notation.indexOf('_')!=0){self.moveCount++;document.getElementById('mv').innerText=self.moveCount;self.history.push(notation);}self.processQueue();}},16);}scramble(){for(var i=0;i<30;i++){var faces=['U','D','F','B','L','R'];var f=faces[Math.floor(Math.random()*6)];if(Math.random()>0.5)f+="'";this.queueMove(f);}}undo(){if(this.history.length==0)return;var last=this.history.pop();var inv=last.indexOf("'")>-1?last[0]:last[0]+"'";this.moveCount=Math.max(0,this.moveCount-1);document.getElementById('mv').innerText=this.moveCount;this.queueMove(inv);this.history.pop();}checkSolved(a){var solved=this.pieces.every(function(p){var o=p.userData.origin;var ps=p.userData.pos;return o.x==ps.x&&o.y==ps.y&&o.z==ps.z;});if(a)alert(solved?'SOLVED!':'Not solved yet');}}var renderer=new Renderer();var app=new CubeApp(renderer);window.app=app;</script></body></html>
