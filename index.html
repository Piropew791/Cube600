<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cube600 v2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#0f0f14;color:#fff;display:flex;flex-direction:column;align-items:center;padding:10px}
.header{width:100%;max-width:400px;display:flex;justify-content:space-between;margin:10px 0}
.box{background:#1e1e28;padding:8px 15px;border-radius:10px;text-align:center}
.box b{display:block;font-size:22px}
#board{width:95vw;max-width:400px;height:95vw;max-height:400px;background:#15151f;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px;border-radius:16px}
.cell{background:#24243a;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:26px}
.cell[data-v="600"]{background:#ff3b30;box-shadow:0 0 20px #ff3b30}
</style>
</head>
<body>
<div class="header">
  <div class="box">SCORE<b id="score">0</b></div>
  <div class="box">BEST<b id="best">0</b></div>
  <div class="box">LEVEL<b id="level">1</b></div>
</div>
<div id="board"></div>
<div style="margin:15px;display:flex;gap:10px">
  <button onclick="undo()" style="padding:10px 16px;border-radius:10px;border:0;background:#2a2a40;color:#fff">Undo</button>
  <button onclick="newGame()" style="padding:10px 16px;border-radius:10px;border:0;background:#2a2a40;color:#fff">New Game</button>
</div>
<p style="opacity:.6;font-size:12px">Swipe to play • Reach 600!</p>
<script>
let board=[],score=0,best=localStorage.getItem('best')||0,history=[];
document.getElementById('best').innerText=best;
function newGame(){board=Array(16).fill(0);score=0;history=[];add();add();draw()}
function add(){let e=[];board.forEach((v,i)=>{if(v==0)e.push(i)});if(e.length)board[e[Math.floor(Math.random()*e.length)]]=Math.random()<.9?2:4}
function draw(){let b=document.getElementById('board');b.innerHTML='';board.forEach(v=>{let d=document.createElement('div');d.className='cell';if(v){d.dataset.v=v;d.innerText=v}b.appendChild(d)});document.getElementById('score').innerText=score;document.getElementById('level').innerText=Math.floor(score/600)+1;if(score>best){best=score;localStorage.setItem('best',best);document.getElementById('best').innerText=best}}
function move(dir){let old=[...board];let rot=b=>{let n=Array(16);for(let r=0;r<4;r++)for(let c=0;c<4;c++)n[c*4+3-r]=b[r*4+c];return n};for(let k=0;k<dir;k++)board=rot(board);for(let r=0;r<4;r++){let row=board.slice(r*4,r*4+4).filter(x=>x!=0);for(let i=0;i<row.length-1;i++){if(row[i]==row[i+1]){row[i]*=2;score+=row[i];row.splice(i+1,1)}}while(row.length<4)row.push(0);for(let c=0;c<4;c++)board[r*4+c]=row[c]}for(let k=0;k<(4-dir)%4;k++)board=rot(board);if(JSON.stringify(old)!=JSON.stringify(board)){let save=[...old,score];history.push(save);add();draw();if(board.includes(600))setTimeout(()=>alert('CUBE 600!'),100)}}
function undo(){if(history.length){let h=history.pop();board=h.slice(0,16);score=h[16];draw()}}
let sx,sy;document.getElementById('board').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY});document.getElementById('board').addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy))move(dx>0?2:0);else move(dy>0?3:1)});
newGame();
</script>
</body>
</html>
