name: Build APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Clean and Setup
        run: |
          rm -rf android
          rm -rf node_modules
          echo '{"name":"cube600","appId":"com.cube600.app","webDir":"www","bundledWebRuntime":false}' > capacitor.config.json
          mkdir -p www
          cp index.html www/ 2>/dev/null || echo "<h1>Cube600</h1>" > www/index.html
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android
          npx cap sync

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Cube600-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
